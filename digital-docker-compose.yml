services:
  mysql:
    image: mysql:8.4
    container_name: dbank-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - "${MYSQL_HOST_PORT}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # Executed only on first startup (empty volume): creates the users table + default user tom
      - ./backend/src/main/resources/db/schema-mysql.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -P 3306 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" -e 'SELECT 1' \"$$MYSQL_DATABASE\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  backend:
    build: ./backend
    container_name: dbank-backend
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS}
    ports:
      - "${BACKEND_HOST_PORT}:8085"
    # Starts only once the MySQL healthcheck (connection on 3306) passes
    depends_on:
      mysql:
        condition: service_healthy
    # Healthy once Tomcat listens on 8085 (Spring Boot only opens the port after the context has started,
    # i.e. after a successful database connection)
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8085 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 40s

  frontend:
    build: ./frontend
    container_name: dbank-frontend
    ports:
      - "${FRONTEND_HOST_PORT}:80"
    # Starts last, once the backend is healthy
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql-data: