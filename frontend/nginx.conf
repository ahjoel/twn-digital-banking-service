server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Compress text responses
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API calls -> Spring Boot backend (replaces proxy.conf.json used by ng serve).
    # "backend" is the service name in docker-compose.yml.
    location /api/ {
        proxy_pass         http://backend:8085;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Angular build output (hashed file names): long-term cache
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpe?g|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached (otherwise new releases are not picked up)
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Angular routing (SPA): any unknown route falls back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
