# Tests run against an in-memory H2 database so no MySQL server is needed
spring.datasource.url=jdbc:h2:mem:digitalbankingdb;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
