# Prod profile: MySQL, the users table must already exist (see db/schema-mysql.sql)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/digitalbankingdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=none
